[[permission]]
identifier = "allow-pick-directory"
description = "Allows selecting a local directory via the native folder picker."
commands.allow = ["pick_directory"]

[[permission]]
identifier = "allow-show-item-in-folder"
description = "Allows revealing a file in the system file manager."
commands.allow = ["show_item_in_folder"]

[[permission]]
identifier = "allow-delete-local-file"
description = "Allows deleting a local media file or HLS package after confirmation."
commands.allow = ["delete_local_file"]
